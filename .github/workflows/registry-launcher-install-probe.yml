name: registry-launcher-install-probe

on:
  push:
    branches:
      - "codex/registry-official-launcher"
    paths:
      - ".github/workflows/registry-launcher-install-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go-service/go.mod
          cache: false

      - name: Download and verify official launcher package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Current CN Endfield official site launcher endpoint, discovered from its live JS config.
          $url = 'https://launcher.hypergryph.com/launcher/latest/TKIVNurE23LREGRw?source=official'
          $file = Join-Path $env:RUNNER_TEMP 'hypergryph-launcher-package.bin'
          $resp = Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $file -PassThru -MaximumRedirection 10 -TimeoutSec 120
          "Final URL: $($resp.BaseResponse.RequestMessage.RequestUri.AbsoluteUri)"
          Get-Item $file | Format-List FullName,Length
          $bytes = [IO.File]::ReadAllBytes($file)
          if ($bytes.Length -lt 2) { throw 'Downloaded package is empty.' }
          $installer = $null
          if ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) {
            $installer = Join-Path $env:RUNNER_TEMP 'HypergryphLauncherSetup.exe'
            Move-Item -LiteralPath $file -Destination $installer -Force
          } elseif ($bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            $zip = Join-Path $env:RUNNER_TEMP 'HypergryphLauncher.zip'
            Move-Item -LiteralPath $file -Destination $zip -Force
            $dir = Join-Path $env:RUNNER_TEMP 'launcher-package'
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            $installer = Get-ChildItem $dir -Recurse -File -Filter *.exe |
              Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName
          } else {
            throw ('Unknown package magic: {0:X2} {1:X2}' -f $bytes[0], $bytes[1])
          }
          if (-not $installer) { throw 'No launcher installer executable found.' }
          $sig = Get-AuthenticodeSignature -LiteralPath $installer
          $sig | Format-List Status,StatusMessage,@{n='Subject';e={$_.SignerCertificate.Subject}},@{n='Thumbprint';e={$_.SignerCertificate.Thumbprint}}
          if ($sig.Status -ne 'Valid') { throw "Installer signature is not valid: $($sig.Status)" }
          if ($sig.SignerCertificate.Thumbprint -notin @('2B366F397E64A9494A553B70004E8CA1AAE02B9D','FF4AF264C36A27F0C805936708EF8EC67B396225')) {
            throw "Unexpected signer: $($sig.SignerCertificate.Thumbprint)"
          }
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Install launcher silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $installer = '${{ steps.package.outputs.installer }}'
          $key = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\33a0a6296a20400d503c59ac0fd6341e'
          function Has-Key {
            foreach ($root in @('HKCU','HKLM')) { foreach ($view in @('64','32')) {
              & reg.exe query "$root\$key" /v InstallLocation "/reg:$view" *> $null
              if ($LASTEXITCODE -eq 0) { return $true }
            }}
            return $false
          }
          foreach ($args in @(@('/S'),@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'),@('/quiet','/norestart'))) {
            if (Has-Key) { break }
            "Trying installer args: $($args -join ' ')"
            try {
              $p = Start-Process -FilePath $installer -ArgumentList $args -PassThru
              if (-not $p.WaitForExit(120000)) {
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                'Installer timed out and was terminated.'
              } else {
                "Installer exit code: $($p.ExitCode)"
              }
            } catch { Write-Host $_ }
            Start-Sleep -Seconds 3
          }
          if (-not (Has-Key)) { throw 'Launcher installation did not create the expected uninstall registration.' }

      - name: Dump launcher registration
        id: registry
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $key = 'Software\Microsoft\Windows\CurrentVersion\Uninstall\33a0a6296a20400d503c59ac0fd6341e'
          $found = $null
          foreach ($root in @('HKCU','HKLM')) { foreach ($view in @('64','32')) {
            "===== $root / reg:$view ====="
            $out = & reg.exe query "$root\$key" "/reg:$view" 2>&1
            $out
            if ($LASTEXITCODE -eq 0 -and -not $found) {
              $line = $out | Where-Object { $_ -match 'InstallLocation' } | Select-Object -First 1
              if ($line -match 'REG_\w+\s+(.+)$') { $found = $Matches[1].Trim() }
            }
          }}
          if (-not $found) { throw 'InstallLocation not found after installation.' }
          $launcher = Join-Path $found 'Launcher.exe'
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw "Launcher.exe missing at $launcher" }
          $sig = Get-AuthenticodeSignature -LiteralPath $launcher
          $sig | Format-List Status,@{n='Subject';e={$_.SignerCertificate.Subject}},@{n='Thumbprint';e={$_.SignerCertificate.Thumbprint}}
          if ($sig.Status -ne 'Valid') { throw "Installed Launcher.exe signature invalid: $($sig.Status)" }
          "launcher=$launcher" >> $env:GITHUB_OUTPUT

      - name: Run MaaEnd registry integration test
        shell: pwsh
        working-directory: agent/go-service
        env:
          MAAEND_TEST_LAUNCHER: ${{ steps.registry.outputs.launcher }}
        run: go test ./pretask/gamelaunch -run 'TestLauncherPathFromInstallLocation|TestInstalledOfficialLauncherRegistration|TestOfficialLauncherSignature' -v
